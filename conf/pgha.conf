# =============================================================================
# pgha.conf — PostgreSQL HA Heartbeat Manager Configuration
# GCP Regional Persistent Disk (RPD) + Private IP Architecture
# =============================================================================

[cluster]
# Unique name of this HA cluster
name = pg-ha-cluster

# This node's logical name (must match instance name below)
node_name = pg-primary

# Peer node's logical name
peer_node = pg-standby

# Private IP of the peer node (used for heartbeat)
peer_ip = 10.0.0.3

# Heartbeat UDP port (must be open between nodes on VPC firewall)
heartbeat_port = 7777

# Peer TCP port for inter-node commands (switchover, PG fail handoff, maintenance).
# Must be open between nodes in GCP firewall. Use a unique port per cluster.
peer_port = 7778

# Heartbeat transmission interval in seconds
heartbeat_interval = 1

# Seconds of missed heartbeats before peer is declared dead.
# Set to at least 15s to survive transient GCP VPC blips without
# triggering a false-positive PEER_DEAD and disk force-detach.
dead_interval = 15

# Quorum timeout: how long to wait for peer before acting alone (seconds)
quorum_timeout = 10

# Fencing settle wait: seconds after fence before acquiring resources.
# GCP's attach/detach API is synchronous (operation.result() confirms
# completion), so this is only a small hypervisor propagation buffer.
fence_wait = 3

# Shared secret for authenticating inter-node TCP commands (port 7778).
# Must be identical on both nodes. Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
# If empty, peer authentication is disabled (NOT recommended in production).
peer_auth_token =

# Maintenance mode flag file path.
# When this file exists, failover/switchover are blocked.
# Use: pgha-ctl maintenance on/off
maintenance_file = /var/run/pgha/maintenance

# -------------------------------------------------------------------------
[gcp]
# GCP project ID
project_id = my-gcp-project

# GCP region (both zones must be in the same region for RPD)
region = us-central1

# Zone for the primary node
zone_primary = us-central1-a

# Zone for the standby node
zone_standby = us-central1-b

# Regional Persistent Disk name (must exist in the region)
disk_name = pg-regional-disk

# Device name as it appears inside the VM (e.g., /dev/disk/by-id/google-<device_name>)
disk_device_name = pg-data-disk

# Mount point for the PostgreSQL data on the RPD
disk_mount_point = /pgdata

# Filesystem type on the RPD (ext4 or xfs recommended)
disk_fs_type = xfs

# GCP instance name for primary node (must match node_name)
instance_primary = pg-primary

# GCP instance name for standby node (must match peer_node)
instance_standby = pg-standby

# NIC name to manage alias IP on (usually nic0)
nic_name = nic0

# Floating/Virtual IP address (alias IP moved between VMs on failover)
# This is the IP clients connect to — must be in the subnet CIDR range
vip_address = 10.0.0.100

# VIP alias IP range in CIDR notation (usually /32)
vip_cidr = 10.0.0.100/32

# Path to GCP service account key JSON
# Leave empty to use Workload Identity / instance default credentials
service_account_key =

# GCP Compute API operation timeout in seconds
# GCP disk operations typically complete in 5-15s; 30s is generous.
api_timeout = 30

# -------------------------------------------------------------------------
[postgresql]
# EDB Postgres Advanced Server 15 (EPAS 15)
# Unix socket directory for EDB AS 15
host = /var/run/edb/as15

# EDB default port (5444); change to 5432 if reconfigured
port = 5444

# EDB superuser (enterprisedb) for health checks
user = enterprisedb

# EDB default maintenance database
database = edb

# Full path to the EDB data directory on the RPD mount point
data_dir = /pgdata/as15/data

# Full path to EDB pg_ctl binary
pg_ctl = /usr/edb/as15/bin/pg_ctl

# Full path to EDB pg_isready binary
pg_isready = /usr/edb/as15/bin/pg_isready

# OS user that owns the EDB process (used to run pg_ctl)
pg_os_user = enterprisedb

# Seconds to wait for EDB to start after disk attach
pg_start_timeout = 60

# Seconds to wait for EDB to stop gracefully
pg_stop_timeout = 30

# -------------------------------------------------------------------------
[monitor]
# How often (seconds) to run the full health check cycle
check_interval = 2

# Timeout for a PostgreSQL query probe (seconds)
pg_response_timeout = 5

# Seconds a CHECK must remain failed before escalating
pg_fail_threshold = 3

# OS CPU usage % that triggers an OS-degraded alert
os_cpu_threshold = 95

# OS memory usage % that triggers an OS-degraded alert
os_mem_threshold = 95

# Disk usage % that triggers a disk-full alert
os_disk_threshold = 90

# Number of consecutive OS threshold violations before alerting
os_fail_count = 5

# -------------------------------------------------------------------------
[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# Log file path (directory must exist; daemon creates it on start)
file = /var/log/pgha/pgha.log

# Maximum log file size in bytes before rotation (100 MB)
max_bytes = 104857600

# Number of rotated log files to keep
backup_count = 10

# -------------------------------------------------------------------------
[api]
# Unix socket path for the local management API (pgha-ctl communicates here)
socket_path = /var/run/pgha/pgha.sock

# -------------------------------------------------------------------------
[efm]
# Enable EDB EFM integration.
# When enabled, pgha starts the EFM service on the PRIMARY node
# and stops it when demoting (switchover/failover/self-demotion).
# EFM should only run where PostgreSQL is running (PRIMARY).
enabled = false

# Systemd service name of EDB EFM (e.g. edb-efm-4.7, edb-efm-4.8)
service_name = edb-efm-4.7
